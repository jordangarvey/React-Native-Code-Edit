name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type-check source and tests
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --ci --coverage

      - name: Build the publishable output
        run: npm run build
